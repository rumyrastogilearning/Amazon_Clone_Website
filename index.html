<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">

            <div class="navlogo border">
            </div>
        
        <div class="navlocation border">
            <div class="location-icon">
            <i class="fa-mosaic fa-solid fa-location-dot"></i>
            </div>           
            <div class="address">  
                <p class="location-text">Delivering to</p>             
               <span class="update-location">Update location</span>
            </div>
        </div>

        <div class="navsearch">

            <select class="search-category" name="category" id="category">
                <option value="all">All</option>
                <option value="books">Books</option>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="home">Home & Kitchen</option>
            </select>
            <input type="text" class="search-input" placeholder="Search for products">
            <div class="search-icon">
                <i class="fa-magnifying-glass fa-solid"></i>
            </div>
        </div>
        </div>
    </header>
</body>
